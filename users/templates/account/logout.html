{% extends "core/base.html" %}

{% block title %}Log Out | SheetMerge{% endblock title %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card card">
        <div class="auth-stack">
            <span class="section-badge">Session</span>
            <h1>Log out of SheetMerge?</h1>
            <p>
                This will end your current session and return you to the public home page.
            </p>
        </div>

        <form class="auth-form" method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button class="button button--primary button--full" type="submit">Log out</button>
        </form>
    </div>
</section>
{% endblock content %}

<div class="topbar">
    <a class="brand" href="{% url 'core:home' %}">
        <span class="brand__mark">S</span>
        <span class="brand__name">SheetMerge</span>
    </a>

    <nav class="topnav" aria-label="Primary navigation">
        <a class="topnav__link topnav__link--active" href="{% url 'core:home' %}">Home</a>
        <a class="topnav__link" href="#">Projects</a>
        <a class="topnav__link" href="#">Uploads</a>
        <a class="topnav__link" href="#">Transactions</a>
    </nav>

    {% if user.is_authenticated %}
        <div class="topbar__actions">
            <a class="button button--secondary" href="{% url 'users:dashboard' %}">Dashboard</a>
            <form action="{% url 'account_logout' %}" method="post">
                {% csrf_token %}
                <button class="button button--primary" type="submit">Log out</button>
            </form>
        </div>
    {% else %}
        <div class="topbar__actions">
            <a class="button button--secondary" href="{% url 'account_login' %}">Log in</a>
            <a class="button button--primary" href="{% url 'account_signup' %}">Sign up</a>
        </div>
    {% endif %}
</div>

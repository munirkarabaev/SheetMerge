{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SheetMerge{% endblock title %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{% static 'core/css/app.css' %}">
</head>
<body>
    {% block page_shell %}
        <div class="site-shell">
            <header class="site-header">
                {% include "core/includes/navbar.html" %}
            </header>

            <main class="site-main">
                {% block content %}{% endblock content %}
            </main>
        </div>
    {% endblock page_shell %}
</body>
</html>
